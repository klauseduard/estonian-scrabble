# Prose linting for documentation and commit messages.
#
# The rules encode the mechanically checkable parts of docs/STYLE.md, for the
# same reason pyproject.toml owns the Python style: a rule written only in
# prose drifts, a rule in a linter does not.
#
# Vale skips fenced code blocks and inline code spans by default, so
# identifiers and command flags are not treated as bad prose.
StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Klaus

# Directories that are not ours to restyle, or not ours at all. Vale has no
# concept of .gitignore, so a bare `vale .` would otherwise walk into the
# virtualenv, the deployment notes and the personal crash-course material.
# The reliable invocation is `vale $(git ls-files '*.md')`; these sections are
# a second line of defence.
[web/**]
BasedOnStyles =

[.venv/**]
BasedOnStyles =

[node_modules/**]
BasedOnStyles =

[deploy/**]
BasedOnStyles =

[crash-course/**]
BasedOnStyles =
