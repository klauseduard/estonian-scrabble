# Prose linting for documentation and commit messages.
#
# The rules encode the mechanically checkable parts of docs/STYLE.md, for the
# same reason pyproject.toml owns the Python style: a rule written only in
# prose drifts, a rule in a linter does not.
#
# Vale skips fenced code blocks and inline code spans by default, so
# identifiers and command flags are not treated as bad prose.
StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Klaus

# The generated web pages and third-party docs are not ours to restyle.
[web/**]
BasedOnStyles =
