[project]
name = "estonian-scrabble"
version = "2.0.0"
description = "Scrabble for the Estonian language, with Hunspell-based word validation"
readme = "README.md"
requires-python = ">=3.12"

# Shared by both front ends: the word list and the AI need spylls, nothing else.
dependencies = [
    "spylls==0.1.7",
]

# pygame is needed only by the desktop client. Keeping it out of the base set is
# what lets the server image skip it; the Dockerfile used to claim it did that
# while installing pygame anyway.
[dependency-groups]
desktop = [
    "pygame==2.5.2",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]
dev = [
    "black==26.5.1",
    "ruff==0.16.4",
    { include-group = "desktop" },
    { include-group = "server" },
]

# An application rather than a library: there is nothing here to build or
# publish, so uv should install the dependencies and leave the tree alone.
[tool.uv]
package = false

# Style configuration for Estonian Scrabble.
#
# The conventions in CLAUDE.md ("PEP 8 with 100-char line length, Black
# formatter") lived only as prose until 2026-08-22, and 20 of 25 source files
# had drifted out of compliance. This file makes them machine-checkable.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle (PEP 8 proper), pyflakes, isort, pep8-naming — the rules
# CLAUDE.md's "Code Style" section already describes.
select = ["E", "W", "F", "I", "N"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export names for the public API; the imports are
# unused *within* the module by design.
"__init__.py" = ["F401"]
# Mock classes bound to locals keep PascalCase so they read as the class they
# stand in for (MockWL, MockGS).
"tests/*" = ["N806", "N803"]

[tool.ruff.lint.isort]
# stdlib → third-party → local, alphabetical within groups (CLAUDE.md).
known-first-party = ["game", "server", "tools", "ui", "wordlist"]

[tool.black]
line-length = 100
target-version = ["py312"]
